name: Publish AI Toolkit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@tomskoczewski"

      - run: npm ci

      - name: Validate package structure
        run: npm run validate

      - name: Install smoke test - pack, install twice, assert one rules block
        run: |
          set -euo pipefail

          TARBALL="$PWD/$(npm pack --silent | tail -n 1)"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"

          npm init -y > /dev/null
          printf '# Consumer rules\n\nPre-existing content.\n' > CLAUDE.md

          npm install "$TARBALL" > /dev/null
          test -f .claude/skills/code-review/SKILL.md

          npm install "$TARBALL" > /dev/null
          node node_modules/@tomskoczewski/ai-toolkit/install.js

          BLOCKS="$(grep -c '<!-- BEGIN @tomskoczewski/ai-toolkit -->' CLAUDE.md)"
          if [ "$BLOCKS" -ne 1 ]; then
            echo "expected exactly 1 rules block after repeated installs, found $BLOCKS"
            exit 1
          fi

          grep -q 'Pre-existing content.' CLAUDE.md

          echo "smoke test passed: skill installed, exactly 1 rules block, consumer content intact"

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@tomskoczewski"

      - run: npm ci

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
